.safe { position:absolute; left:6mm; top:6mm; right:6mm; bottom:6mm; }

.ink .contact, .ink .contact b { color:#fff; }
.qr { width:15mm; height:15mm; }

.maru { font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif; }
.chara { position:absolute; display:block; }

:root { --muted:#574f43; }

.wrap { display:grid; grid-template-columns:repeat(2, 95mm); gap:6mm 6mm; }
figcaption { font-family:'Noto Sans JP'; font-size:2.6mm; color:var(--ink); margin-bottom:1.6mm; }
